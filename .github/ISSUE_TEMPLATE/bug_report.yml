name: Bug report
description: Something Gamba does wrong on its own — a feature beyond Prawn, an invalid PDF, a crash
labels: [bug]
body:
  - type: textarea
    id: script
    attributes:
      label: Script
      description: The smallest Ruby that reproduces it. Attach the fonts, images or Factur-X XML it needs.
      render: ruby
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      description: What you expected, what happened instead (backtrace, `qpdf --check` or veraPDF output, the PDF).
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Gamba 1.0.0 (or commit), Ruby 4.0.1
    validations:
      required: true
