name: Release

# Publishes the version a release pull request brings to main: bin/release opens that pull request, and once it
# merges this tags its commit vX.Y.Z, publishes the gem to RubyGems, then the GitHub release with its section
# of CHANGELOG.md. A push to main whose version is already tagged, or has no notes yet, publishes nothing. RubyGems
# trusts this workflow (trusted publishing): no API key is stored anywhere.
on:
  push:
    branches: [main]
  workflow_dispatch: # publishes main's version from its release commit, after a run that failed or was rejected

permissions:
  contents: read

jobs:
  version:
    name: Version to release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the commit that wrote the version's notes
          filter: blob:none
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"
      - name: Find an untagged version with notes
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(ruby -e 'puts Gem::Specification.load(Dir["*.gemspec"].first).version')
          # Released once its GitHub release exists, the last step: a tag alone is a run to finish.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" --silent 2> /dev/null; then
            echo "v$version is already released"; exit 0
          fi
          bin/release --check "v$version" || { echo "$version has no notes yet: nothing to release"; exit 0; }
          # The release is the commit that wrote the version's notes: a later push publishes nothing, a dispatch
          # publishes that commit again.
          commit=$(git log -1 --format=%H -F -S "## [$version]" -- CHANGELOG.md)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$commit" != "$GITHUB_SHA" ]; then
            echo "v$version is ${commit:0:7}'s release, not this commit's: run its release again, or this workflow by hand"
            exit 0
          fi
          # Only a reviewed change publishes: that commit must come from a pull request merged into main. GitHub links
          # a merge commit to its pull request a few seconds after the push.
          for attempt in 1 2 3 4 5 6; do
            merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit/pulls" --jq '[.[] | select(.merged_at and .base.ref == "main")] | length' || echo 0)
            [ "$merged" -gt 0 ] && break
            sleep 10
          done
          test "$merged" -gt 0 || { echo "::error::No merged pull request brings ${commit:0:7}, which writes $version's notes"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  release:
    name: RubyGems and GitHub release
    needs: version
    if: needs.version.outputs.version
    runs-on: ubuntu-latest
    # Settings > Environments > release: who must approve a publication.
    environment: release
    # One release at a time, never cancelled halfway through a publication.
    concurrency:
      group: release
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # trusted publishing to RubyGems
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.commit }}
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"
          rubygems: latest # 4.1+ attaches a Sigstore attestation to gem push
      # Each step below skips what an earlier run did, so that a failed run can simply run again.
      - name: Tag the release commit
        run: |
          if tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha 2> /dev/null); then
            [ "$tagged" = "$COMMIT" ] || { echo "::error::$TAG already tags $tagged, not $COMMIT"; exit 1; }
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$COMMIT" --silent
          fi
      - name: Build the gem
        run: gem build *.gemspec
      - name: Check whether RubyGems has it
        id: rubygems
        run: |
          name=$(ruby -e 'puts Gem::Specification.load(Dir["*.gemspec"].first).name')
          if curl --silent --fail --output /dev/null "https://rubygems.org/api/v2/rubygems/$name/versions/${TAG#v}.json"; then
            echo "$name ${TAG#v} is already on RubyGems (an earlier run, or a new gem's first version pushed by hand)"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Get RubyGems credentials (trusted publishing)
        if: steps.rubygems.outputs.published != 'true'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish to RubyGems
        if: steps.rubygems.outputs.published != 'true'
        run: gem push *.gem
      - name: Create the GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already has its GitHub release"; exit 0
          fi
          bin/release --notes "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" *.gem --verify-tag \
            --title "$(bin/release --title "$TAG")" --notes-file "$RUNNER_TEMP/notes.md"
