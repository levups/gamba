name: CI

# The blocks shared by the gems of next-gen-gems are kept identical across the family.

on:
  push:
    branches: [main]
  # A draft runs nothing: marking it ready for review starts the CI.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rubocop:
    name: RuboCop
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Lint with RuboCop
        run: bundle exec rubocop --format github

  test:
    name: Ruby ${{ matrix.ruby }}${{ matrix.gemfile != 'Gemfile' && format(', {0}', matrix.gemfile) || '' }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ endsWith(matrix.ruby, '-head') }}
    strategy:
      fail-fast: false
      matrix:
        # Every Ruby the core team still maintains (https://endoflife.date/ruby), ruby-head, then this gem's extra ones.
        ruby: ["3.3", "3.4", "4.0", ruby-head, truffleruby-head]
        gemfile: [Gemfile]
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile != 'Gemfile' && matrix.gemfile || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install the PDF tools
        run: sudo apt-get update && sudo apt-get install --yes mupdf-tools poppler-utils qpdf
      - name: Set up Java for Mustang, the Factur-X validator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache the corpus and Mustang
        uses: actions/cache@v6
        with:
          path: |
            corpus/cache
            ~/.cache/prawnx-tools
          key: prawnx-${{ runner.os }}-${{ hashFiles('corpus/manifest.yml', '.github/workflows/ci.yml') }}
      - name: Install Prawn, the oracle
        run: BUNDLE_GEMFILE=oracle/Gemfile bundle install
      - name: Fetch the corpus
        run: bundle exec rake corpus:fetch
      - name: Fetch Mustang
        run: |
          mkdir -p ~/.cache/prawnx-tools
          test -f ~/.cache/prawnx-tools/Mustang-CLI.jar || curl -sSfL -o ~/.cache/prawnx-tools/Mustang-CLI.jar https://github.com/ZUGFeRD/mustangproject/releases/download/core-2.26.0/Mustang-CLI-2.26.0.jar
      - name: Check the oracle, Prawn against itself
        run: ORACLE_CANDIDATE=prawn FUZZ_CASES=0 bundle exec rake test
      - name: Run the tests
        run: bundle exec rake test
      - name: Fuzz 300 documents
        run: FUZZ_SEED=$GITHUB_RUN_ID FUZZ_CASES=300 bundle exec ruby -Itest test/fuzz_test.rb
      - name: Fuzz 400 malformed inputs
        run: INPUT_FUZZ_SEED=$GITHUB_RUN_ID INPUT_FUZZ_CASES=400 bundle exec ruby -Itest test/input_fuzz_test.rb

  docs:
    name: Highlighted docs
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Check the highlighted docs
        run: bundle exec rake docs:highlight:check

  # The one check main's ruleset requires, so the Rubies, Rails and jobs above can change without touching it.
  # Every other job belongs in needs: bin/x-gems-ci-check in levups/oss checks it.
  passed:
    name: CI passed
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [rubocop, test, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check every job succeeded
        run: echo "$NEEDS" | jq --exit-status 'all(.[]; .result == "success")'
        env:
          NEEDS: ${{ toJSON(needs) }}
