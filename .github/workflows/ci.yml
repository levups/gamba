name: CI

# The blocks shared by the Level UP Solutions gems are kept identical across the family.

on:
  push:
    branches: [main]
  # A draft runs nothing: marking it ready for review starts the CI.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rubocop:
    name: RuboCop
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Lint with RuboCop
        run: bundle exec rubocop --format github

  test:
    name: Ruby ${{ matrix.ruby }}${{ matrix.rails && format(' · Rails {0}', matrix.rails.version) || '' }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every Ruby the core team still maintains (https://endoflife.date/ruby); the -head ones are in head.
        ruby: ["3.3", "3.4", "4.0"]
        rails: [{version: "8.1", gemfile: Gemfile}, {version: "8.0", gemfile: gemfiles/rails_8_0.gemfile}]
    env:
      BUNDLE_GEMFILE: ${{ matrix.rails.gemfile != 'Gemfile' && matrix.rails.gemfile || '' }}
    steps: &test-steps
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Cache the corpus, Mustang and the PDF tools' packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            corpus/cache
            ~/.cache/gamba-tools
            ~/.cache/apt-archives
          key: gamba-${{ runner.os }}-${{ hashFiles('corpus/manifest.yml', '.github/workflows/ci.yml') }}
          # A change to this file starts from the previous cache: without its packages, the fallback below has none.
          restore-keys: gamba-${{ runner.os }}-
      # 2026-11-04: Azure's Ubuntu mirror stalls for minutes on libmupdf (34 MB), which cancelled whole jobs: the
      # packages come from the cache, and a stalled attempt is cut after 90 seconds and resumed.
      # 2026-11-11: the mirror stopped answering apt-get update for hours: the cached packages are then installed
      # as they are.
      - name: Install the PDF tools
        timeout-minutes: 6
        run: |
          mkdir -p ~/.cache/apt-archives/partial
          for attempt in 1 2 3; do
            if sudo timeout 90 apt-get update; then
              sudo timeout 90 apt-get install --yes \
                -o Dir::Cache::Archives="$HOME/.cache/apt-archives" mupdf-tools poppler-utils qpdf zbar-tools dmtx-utils && break
            else
              sudo dpkg --install ~/.cache/apt-archives/*.deb && break
            fi
            test "$attempt" -lt 3 || exit 1
          done
          sudo chown -R "$USER" ~/.cache/apt-archives
      - name: Set up Java for Mustang, the Factur-X validator
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Prawn, the oracle
        run: BUNDLE_GEMFILE=oracle/Gemfile bundle install
      - name: Fetch the corpus
        run: bundle exec rake corpus:fetch
      - name: Fetch Mustang
        run: |
          mkdir -p ~/.cache/gamba-tools
          test -f ~/.cache/gamba-tools/Mustang-CLI.jar || curl -sSfL -o ~/.cache/gamba-tools/Mustang-CLI.jar https://github.com/ZUGFeRD/mustangproject/releases/download/core-2.26.0/Mustang-CLI-2.26.0.jar
          # The jar runs in CI: the release's SHA-256, its SHA-1 matching Maven Central's org.mustangproject:Mustang-CLI:2.26.0.
          echo "42d7868cb68264874a7b8cab4c3587b03b23ccc7cd72373da917f66758bb9736  $HOME/.cache/gamba-tools/Mustang-CLI.jar" | sha256sum --check --strict
      - name: Check the oracle, Prawn against itself
        run: ORACLE_CANDIDATE=prawn FUZZ_CASES=0 bundle exec rake test
      - name: Run the tests
        run: bundle exec rake test
      - name: Fuzz 300 documents
        run: FUZZ_SEED=$GITHUB_RUN_ID FUZZ_CASES=300 bundle exec ruby -Itest test/fuzz_test.rb
      - name: Fuzz 400 malformed inputs
        run: INPUT_FUZZ_SEED=$GITHUB_RUN_ID INPUT_FUZZ_CASES=400 bundle exec ruby -Itest test/input_fuzz_test.rb
      - name: Fuzz 1000 trees of boxes
        run: LAYOUT_FUZZ_SEED=$GITHUB_RUN_ID LAYOUT_FUZZ_CASES=1000 bundle exec ruby -Itest test/layout_fuzz_test.rb

  # Allowed to fail, and truffleruby-head takes twice as long as the others: CI passed doesn't wait for them.
  head:
    name: Ruby ${{ matrix.ruby }}${{ matrix.rails && format(' · Rails {0}', matrix.rails.version) || '' }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # ruby-head, then this gem's extra ones.
        ruby: [ruby-head, truffleruby-head]
    env:
      BUNDLE_GEMFILE: ${{ matrix.rails.gemfile != 'Gemfile' && matrix.rails.gemfile || '' }}
    steps: *test-steps

  docs:
    name: Highlighted docs
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Check the highlighted docs
        run: bundle exec rake docs:highlight:check

  # The one check main's ruleset requires, so the Rubies, Rails and jobs above can change without touching it.
  # Every other job belongs in needs: bin/x-gems-ci-check in levups/oss checks it.
  passed:
    name: CI passed
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [rubocop, test, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check every job succeeded
        run: echo "$NEEDS" | jq --exit-status 'all(.[]; .result == "success")'
        env:
          NEEDS: ${{ toJSON(needs) }}
