name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gem:
    uses: next-gen-gems/.github/.github/workflows/gem-ci.yml@ci/shared
    with:
      extra-rubies: '["truffleruby-head"]'
      apt-packages: mupdf-tools poppler-utils qpdf
      brew-packages: mupdf-tools poppler qpdf
      java-version: "21"
      cache-path: |
        corpus/cache
        ~/.cache/prawnx-tools
      cache-key-files: |
        corpus/manifest.yml
        .github/workflows/ci.yml
      # Mustang is the Factur-X validator test/pdf_a_test.rb runs.
      setup-command: |
        BUNDLE_GEMFILE=oracle/Gemfile bundle install
        bundle exec rake corpus:fetch
        mkdir -p ~/.cache/prawnx-tools
        test -f ~/.cache/prawnx-tools/Mustang-CLI.jar || curl -sSfL -o ~/.cache/prawnx-tools/Mustang-CLI.jar https://github.com/ZUGFeRD/mustangproject/releases/download/core-2.26.0/Mustang-CLI-2.26.0.jar
      test-command: |
        ORACLE_CANDIDATE=prawn FUZZ_CASES=0 bundle exec rake test
        bundle exec rake test
        FUZZ_SEED=$GITHUB_RUN_ID FUZZ_CASES=300 bundle exec ruby -Itest test/fuzz_test.rb
        INPUT_FUZZ_SEED=$GITHUB_RUN_ID INPUT_FUZZ_CASES=400 bundle exec ruby -Itest test/input_fuzz_test.rb
      timeout-minutes: 15
