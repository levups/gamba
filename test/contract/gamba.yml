# Gamba's own public API, as Method#parameters gives it. test/native_contract_test.rb fails when a method listed here
# changes its signature, and when a public method of these classes is missing from the list: a change here is a
# decision, breaking when it removes or narrows something.
Gamba:
  ".combine": [req sources, key page_size, key orientation]
  ".document": [keyrest options]
  ".eager_load!": []
Gamba::Document:
  "#barcode": [req data, keyrest options]
  "#data_matrix": [req data, keyrest options]
  "#draw": [req component]
  "#page_break": []
  "#prawn": []
  "#row": [keyrest options]
  "#stack": [keyrest options]
  "#footer": [key gap, block block]
  "#grid": [keyreq columns, keyrest options]
  "#header": [key gap, block block]
  "#image": [req source, keyrest options]
  "#pdf_page": [req source, key page, keyrest options]
  "#qr_code": [req text, key level, keyrest options]
  "#register_font": [req family, keyreq normal, key bold, key italic, key bold_italic, key features]
  "#style": [req name, keyrest attributes]
  "#table": [req rows, keyrest options, block styling]
  "#text": [req string, key style, keyrest attributes]
  "#to_s": []
  "#write": [req destination]
# What a stack, a row and a grid answer inside their block; the rest of the class is how they are measured and placed.
Gamba::Layout::Container:
  "#barcode": [req data, keyrest options]
  "#data_matrix": [req data, keyrest options]
  "#draw": [req component]
  "#grid": [keyreq columns, keyrest options]
  "#image": [req source, keyrest options]
  "#pdf_page": [req source, key page, keyrest options]
  "#qr_code": [req text, key level, keyrest options]
  "#row": [keyrest options]
  "#stack": [keyrest options]
  "#table": [req rows, keyrest options, block styling]
  "#text": [req string, key style, key width, key grow, keyrest attributes]
Prawn::Document:
  "#gamba": []
